name: otto-control-plane

x-app-env: &app-env
  env_file:
    - .env
  environment:
    HOSTNAME: 0.0.0.0
    INTEGRATION_GATEWAY_INTERNAL_URL: http://integration-gateway:3001
    NODE_ENV: production
    PORT: 3000
  image: ${OTTO_IMAGE:-otto-control-plane:local}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-otto}
      POSTGRES_USER: ${POSTGRES_USER:-otto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - otto_control_plane_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app-env
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_POSTHOG_ENABLED: ${NEXT_PUBLIC_POSTHOG_ENABLED:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
        NEXT_PUBLIC_POSTHOG_TOKEN: ${NEXT_PUBLIC_POSTHOG_TOKEN:-}
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["ops"]
    restart: "no"

  web:
    <<: *app-env
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_POSTHOG_ENABLED: ${NEXT_PUBLIC_POSTHOG_ENABLED:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
        NEXT_PUBLIC_POSTHOG_TOKEN: ${NEXT_PUBLIC_POSTHOG_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  integration-gateway:
    <<: *app-env
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_POSTHOG_ENABLED: ${NEXT_PUBLIC_POSTHOG_ENABLED:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
        NEXT_PUBLIC_POSTHOG_TOKEN: ${NEXT_PUBLIC_POSTHOG_TOKEN:-}
    command: ["bun", "src/integration-gateway/server.ts"]
    environment:
      HOSTNAME: 0.0.0.0
      INTEGRATION_GATEWAY_INTERNAL_URL: http://integration-gateway:3001
      INTEGRATION_GATEWAY_PORT: 3001
      NODE_ENV: production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    environment:
      API_ORIGIN: http://web:3000
      FRONTEND_PORT: 3000
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      WORKSPACE_APP_ORIGIN: https://${CONTROL_PLANE_DOMAIN}
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  www:
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    build:
      context: ../www
      dockerfile: Dockerfile
    profiles: ["legacy-www"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    <<: *app-env
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_POSTHOG_ENABLED: ${NEXT_PUBLIC_POSTHOG_ENABLED:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
        NEXT_PUBLIC_POSTHOG_TOKEN: ${NEXT_PUBLIC_POSTHOG_TOKEN:-}
    command: ["npm", "run", "worker"]
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.9-alpine
    depends_on:
      frontend:
        condition: service_healthy
      integration-gateway:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      LANDING_PAGE_DOMAIN: ${LANDING_PAGE_DOMAIN:?set LANDING_PAGE_DOMAIN in .env}
      CONTROL_PLANE_DOMAIN: ${CONTROL_PLANE_DOMAIN:?set CONTROL_PLANE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - otto_control_plane_caddy_data:/data
      - otto_control_plane_caddy_config:/config

volumes:
  otto_control_plane_caddy_config:
  otto_control_plane_caddy_data:
  otto_control_plane_postgres_data:
